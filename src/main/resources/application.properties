spring.application.name=spring-boot-jpa1-exercise

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/jpa_relation_db
spring.datasource.username=root
spring.datasource.password=

# Specifies MySQL as the Hibernate database dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Displays SQL queries generated by Hibernate in the console
spring.jpa.show-sql=true

# Allows Hibernate to generate the database schema
spring.jpa.generate-ddl=true

# Creates the database tables when the application starts and drops them when the application stops
# For learning use "create-drop", for development use "update"
spring.jpa.hibernate.ddl-auto=update


# Includes the exception message in error responses
spring.web.error.include-message=always

# Includes the stack trace in error responses
spring.web.error.include-stacktrace=always